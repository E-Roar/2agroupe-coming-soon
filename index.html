<style>
@import url("https://fonts.googleapis.com/css?family=Ubuntu");

html, body { height: 100%; margin: 0; }
* { box-sizing: border-box; }

body {
  background: linear-gradient(to top, #D96A2B, #2B2B2B 70%);
  font-family: Ubuntu, sans-serif;
  color: #fff;
  overflow: hidden;
}

#content {
  position: relative;
  z-index: 5;
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 1.5rem;
  text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.6);
}
#content img {
  height: clamp(90px, 14vw, 150px);
  width: auto;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
}
#content h1 {
  margin: 1.5rem 0 0;
  font-size: clamp(1.6rem, 4.5vw, 2.8rem);
  font-weight: 900;
  letter-spacing: 0.04em;
}
#content h1 em {
  font-style: normal;
  color: #E8A24A;
}
#content p {
  margin: 0.75rem auto 0;
  max-width: 34rem;
  font-size: clamp(1rem, 2.4vw, 1.25rem);
  opacity: 0.92;
}

#outerCraneContainer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.buildings {
  height: 84.9673202614379px;
  width: 100%;
  left: 0;
  position: absolute;
  bottom: 0;
}
.buildings div {
  height: inherit;
  width: 42.48366013071895px;
  background: #B8551F;
  position: absolute;
  bottom: 10%;
}
.buildings div:after {
  content: '';
  width: 80%;
  height: 60%;
  left: 10%;
  bottom: 30%;
  background: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAMAAAAGCAYAAAAG5SQMAAAAFElEQVQImWP4////fwYYIJKDEwAAfPsP8eFXG40AAAAASUVORK5CYII=") repeat;
  position: absolute;
}
.buildings div:nth-of-type(1) { width: 42.48366013071895px; height: 21.241830065359476px; right: 37%; bottom: 18%; }
.buildings div:nth-of-type(1):after { bottom: 11%; }
.buildings div:nth-of-type(2) { width: 48.552754435107374px; height: 28.322440087145967px; right: 30%; bottom: 35%; transform: rotate(180deg); }
.buildings div:nth-of-type(2):after { width: 60%; left: 11%; }
.buildings div:nth-of-type(3) { width: 24.276377217553687px; height: 37.76325344952796px; left: 40%; bottom: 35%; }
.buildings div:nth-of-type(3):after { bottom: 0; width: 20%; height: 85%; left: 70%; }
.buildings div:nth-of-type(4) { width: 84.9673202614379px; height: 21.241830065359476px; left: 24%; bottom: 20%; }
.buildings div:nth-of-type(4):after { background: none; }
.buildings div:nth-of-type(5) { width: 61.794414735591204px; height: 67.97385620915033px; left: 47%; bottom: 10%; }
.buildings div:nth-of-type(5):after { bottom: 0; width: 40%; height: 85%; left: 20%; }

.crane, .buildings { position: absolute; bottom: 0; }
.crane div { border-radius: 2px; position: absolute; }
.crane .line { border: none; background: #D96A2B; outline: 1px solid transparent; z-index: 0; }
.crane .lineOne { width: 60%; left: 11%; top: 0; }
.crane .lineTwo { width: 19%; right: 8%; top: 0; }
.crane .line.lineThree { height: 30%; top: 22%; left: 9%; }
.crane .line.lineThree:after {
  content: '';
  position: absolute;
  height: 0.2em;
  width: 9000%;
  background: #E8A24A;
  display: block;
  bottom: 0;
  left: -4500%;
  border: solid 1px #D96A2B;
}
.craneTwo .line.lineThree:after { height: 0.1em; }
.craneThree .line.lineThree:after { height: 0.05em; }
.stand {
  height: 100%;
  width: 5%;
  right: 25%;
  z-index: 1;
  background: linear-gradient(to top, #D96A2B, #E8A24A);
}
.craneTwo .stand { background: linear-gradient(to top, #D96A2B, #E19A55); }
.craneThree .stand { background: linear-gradient(to top, #D96A2B, #DD9250); }
.weight { height: 20%; width: 8%; right: 4%; top: 12%; z-index: 2; background: #E19A55; }
.craneTwo .weight { background: #DD9250; }
.craneThree .weight { background: #D98A48; }
.cabin { height: 9%; width: 12%; right: 24%; top: 20%; z-index: 2; background: #E19A55; }
.cabin:after { content: ''; position: absolute; height: 10%; width: 100%; background: #fff; display: block; top: 60%; left: 0; }
.craneTwo .cabin { background: #DD9250; }
.craneThree .cabin { background: #D98A48; }
.arm { height: 7%; width: 100%; top: 15%; z-index: 3; background: #E19A55; }
.craneTwo .arm { background: #DD9250; }
.craneThree .arm { background: #D98A48; }
.crane div.arm { border-top-left-radius: 10px; }
.brick { height: 6%; width: 9%; bottom: 0; left: 40%; background: #D96A2B; }
.brickTwo { left: 48%; }
.brickThree { bottom: 5.5%; left: 44%; }

.craneOne { width: 260px; height: 169.9346405228758px; left: 20%; }
.craneOne div { border: solid 1px #D96A2B; }
.craneOne .line { height: 1px; }
.craneOne .lineThree { width: 1px; }
.craneTwo { width: 200px; height: 130.718954248366px; transform: scaleX(-1); left: 40%; z-index: -1; }
.craneTwo div { border: solid 1px #D96A2B; }
.craneTwo .line { height: 0.769230769230769px; }
.craneTwo .lineThree { width: 0.714285714285714px; animation-delay: 3s; }
.craneTwo .cabin, .craneTwo .arm, .craneTwo .picker, .craneTwo .weight { animation-delay: 3s; }
.craneThree { width: 130px; height: 84.9673202614379px; left: 60%; z-index: -1; }
.craneThree div { border: solid 1px #D96A2B; }
.craneThree .line { height: 0.5px; }
.craneThree .lineThree { width: 0.5px; animation-delay: 1.5s; }
.craneThree .brickThree { bottom: 5%; }
.craneThree .brickOne, .craneThree .brickTwo { bottom: 0; }
.craneThree .cabin, .craneThree .arm, .craneThree .picker, .craneThree .weight { animation-delay: 1.5s; }

.crane { perspective: 600px; }
.lineOne { transform-origin: right 0; animation: moveLineOne 12s infinite alternate; }
.lineTwo { transform-origin: top left; animation: moveLineTwo 12s infinite alternate; }
.lineThree { transform-origin: right center; animation: moveLineThree 12s ease-in-out infinite alternate; }
.cabin, .arm, .picker { transform-origin: 80% center; animation: moveCrane 12s infinite alternate; }
.weight { transform-origin: 0 center; animation: moveWeight 12s infinite alternate; }

@keyframes moveCrane {
  0%, 20% { transform: rotateY(0); }
  70%, 100% { transform: rotateY(45deg); }
}
@keyframes moveWeight {
  0%, 20% { transform: rotateY(0) translateX(0); }
  70%, 100% { transform: rotateY(45deg) translateX(-50%); }
}
@keyframes moveLineOne {
  0%, 20% { transform: rotateY(0) rotateZ(-10deg); }
  70%, 100% { transform: rotateY(45deg) rotateZ(-10deg); }
}
@keyframes moveLineTwo {
  0%, 20% { transform: rotateY(0) rotateZ(29deg); }
  70%, 100% { transform: rotateY(15deg) rotateZ(29deg); }
}
@keyframes moveLineThree {
  0% { transform: translate(0, 0); }
  20% { transform: translate(2500%, -18%); }
  60% { transform: translate(11000%, -25%); }
  70% { transform: translate(9100%, -25%); height: 30%; }
  90%, 100% { transform: translate(9100%, -15%); height: 80%; }
}

#license {
  position: absolute;
  bottom: 0;
  right: 5px;
  font-size: 0;
  z-index: 5;
}

@media (max-width: 640px) {
  .craneOne { left: -10%; }
  .craneTwo { left: 45%; }
  .craneThree { left: 75%; }
}
</style>

    <div class="stand"></div>
    <div class="weight"></div>
